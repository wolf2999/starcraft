<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarCraft Demo - Phaser 4</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0a0a12;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: #0a0a12;
      }
      /* 强制 Phaser canvas 在容器内绝对居中，覆盖运行时可能设置的 margin/position */
      #game canvas {
        display: block !important;
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        right: auto !important;
        bottom: auto !important;
        margin: 0 !important;
        transform: translate(-50%, -50%) !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
